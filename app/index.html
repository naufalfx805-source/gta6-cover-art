<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vice Cover Studio — GTA 6 Cover Art Maker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- Header -->
  <header id="header">
    <h1>Vice Cover Studio</h1>
    <span class="subtitle">GTA 6 Cover Art Maker</span>
  </header>

  <!-- Sidebar controls -->
  <aside id="sidebar">

    <!-- Upload -->
    <section>
      <div class="section-label">Photo</div>
      <div class="upload-row">
        <button class="btn-secondary" id="upload-btn">📷 Upload Photo</button>
        <input type="file" id="file-input" accept="image/*" multiple style="display:none">
        <div class="sample-row">
          <button data-sample="pier">Sample: Pier</button>
          <button data-sample="boulevard">Sample: Boulevard</button>
        </div>
      </div>
    </section>

    <hr class="divider">

    <!-- Layout picker -->
    <section>
      <div class="section-label">Panel Layout</div>
      <div id="layout-picker"></div>
    </section>

    <hr class="divider">

    <!-- Color grade picker -->
    <section>
      <div class="section-label">Color Grade</div>
      <div id="grade-picker"></div>
    </section>

    <hr class="divider">

    <!-- Caption -->
    <section>
      <div class="section-label">Caption</div>
      <input type="text" id="caption-input" maxlength="40" placeholder="Your caption here…">
    </section>

    <hr class="divider">

    <!-- Export -->
    <section class="export-section">
      <div class="section-label">Export</div>
      <select id="export-size"></select>
      <button class="btn-primary" id="export-btn">⬇ Export PNG</button>
    </section>

  </aside>

  <!-- Canvas preview -->
  <main id="canvas-area">
    <canvas id="preview-canvas" width="540" height="540" title="Live cover art preview — exports at the chosen resolution"></canvas>
  </main>

  <!-- Footer status -->
  <footer id="footer">
    <span id="status">Ready — upload a photo or use a sample</span>
    <span>Vice Cover Studio · <a href="https://make.fun/bounty/gta6-cover-art-01" style="color:#c0188c">make.fun</a></span>
  </footer>

</div>

<script type="module">
  import { handleShotMode } from './src/shots.js';
  import { init }           from './src/main.js';

  // If running in screenshot mode (?shot=...), render that shot
  if (!handleShotMode()) {
    // Normal interactive mode
    init();
  }
</script>
</body>
</html>
